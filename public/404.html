<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | MediQueue</title>
  <meta name="description" content="The requested page could not be found on MediQueue." />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      line-height: 1.6;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      max-width: 28rem;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4.5rem;
      height: 4.5rem;
      background-color: #f0fdfa;
      border: 1px solid #ccfbf1;
      border-radius: 1.25rem;
      color: #0f766e;
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1rem;
      color: #334155;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem 1.25rem;
      background-color: #0f766e;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 0.75rem;
      transition: background-color 0.15s ease;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #115e59;
    }
    .btn:focus-visible {
      outline: 2px solid #0f766e;
      outline-offset: 2px;
    }
    .footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #f1f5f9;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="badge" aria-hidden="true">404</div>
    <h1>Page Not Found</h1>
    <p>
      The page or resource you requested does not exist or has been relocated within the MediQueue system.
    </p>
    <a href="/patient" class="btn">
      Return to Patient Portal
    </a>
    <div class="footer">
      MediQueue Multi-Clinic OS • Real-Time Token Routing
    </div>
  </main>
</body>
</html>
